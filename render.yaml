services:
  - type: web
    name: hush-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: hush-api
          envVarKey: RENDER_EXTERNAL_URL

      - key: BACKEND_API_KEY
        fromService:
          type: web
          name: hush-api
          envVarKey: DENOISE_API_KEY

      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false

      - key: CLERK_SECRET_KEY
        sync: false

      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in

      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up

  - type: web
    name: hush-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DENOISE_API_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: http://localhost:3000

      - key: MAX_UPLOAD_MB
        value: "500"

      - key: MAX_DURATION_MIN
        value: "120"

      - key: CHUNK_SECONDS
        value: "30"

      - key: JOB_TTL_SECONDS
        value: "1800"

      - key: HUSH_ENGINE
        value: deepfilternet